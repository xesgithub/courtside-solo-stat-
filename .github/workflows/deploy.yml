name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # อนุญาตให้สั่ง run เองจากหน้า Actions
  workflow_dispatch:

# สิทธิ์ที่จำเป็นสำหรับการ deploy ขึ้น Pages
permissions:
  contents: read
  pages: write
  id-token: write

# ให้ deploy ทีละครั้ง ไม่ยกเลิก run ที่กำลังทำงาน
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # เปิดใช้ Pages ให้อัตโนมัติหากยังไม่ได้เปิด (กัน error "Get Pages site failed / Not Found")
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
